name: Unity Compile Check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use GameCI's unity-builder to install and invoke Unity
      - uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.0f1   # Replace with your Unity version
          projectPath: ./
          # This step builds, but you can use it to check compilation.
          # To only check compilation, use a dummy build target.
          targetPlatform: StandaloneLinux64
